name: RedDoorz
description: >-
  RedDoorz is a Southeast Asian budget-hospitality technology company that
  operates a franchise and management network of economy hotels and rooms across
  Indonesia, Singapore, the Philippines, Vietnam, and Thailand. Through its
  consumer website and mobile apps travelers can search, book, and pay for
  value-priced stays, while its "List your property" program onboards independent
  hotel owners onto the RedDoorz brand, distribution, loyalty, and
  property-management platform. Backed by 500 Global and Qiming Venture Partners,
  the company operates a consumer booking product rather than a public developer
  platform; as of this pass it does not publish a public developer API, developer
  portal, or /.well-known discovery surface. This profile tracks the company's
  digital and security surface for the API Evangelist network.
